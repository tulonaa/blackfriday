<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WPDeveloper Black Friday and Cyber Monday 2026</title>
<meta name="description" content="Up to 75% off WordPress plugins and SaaS, plus Shopify apps and hosting from WPDeveloper.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a14}
*{box-sizing:border-box}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px;position:relative}
.outline{color:transparent;-webkit-text-stroke:2px #38bdf8;text-shadow:0 0 18px rgba(56,189,248,.65)}
.outline-thin{color:transparent;-webkit-text-stroke:1.5px #38bdf8;text-shadow:0 0 14px rgba(56,189,248,.6)}
.solid{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.25)}
.grad{background:linear-gradient(90deg,#f472b6,#a78bfa 55%,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(236,72,153,.45))}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick-track{display:flex;width:max-content;animation:tick 42s linear infinite}
.cta-card{transition:transform .2s ease}
.cta-card:hover{transform:translateY(-4px)}
.card-btn:hover{filter:brightness(1.2)}
.nav-btn:hover{filter:brightness(1.12)}
@media (max-width:760px){.nav-links{display:none !important}}
@media (prefers-reduced-motion:reduce){.tick-track{animation:none}.cta-card{transition:none}}
</style>

<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div id="top" style="position:relative;overflow:hidden;min-height:100%;font-family:'Manrope',system-ui,sans-serif;color:#fff;background-color:#0a0a14;background-image:radial-gradient(ellipse 70% 38% at 50% 0%,rgba(168,85,247,.26),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 100%,64px 64px,64px 64px">

  <!-- decorative neon rings -->
  <div aria-hidden="true" style="position:absolute;left:-360px;top:110px;width:520px;height:520px;border-radius:50%;border:4px solid #ec4899;box-shadow:0 0 44px rgba(236,72,153,.75),inset 0 0 44px rgba(236,72,153,.5)"></div>
  <div aria-hidden="true" style="position:absolute;right:-360px;top:-30px;width:520px;height:520px;border-radius:50%;border:4px solid #8b5cf6;box-shadow:0 0 44px rgba(139,92,246,.75),inset 0 0 44px rgba(139,92,246,.5)"></div>
  <div aria-hidden="true" style="position:absolute;left:-380px;top:1500px;width:480px;height:480px;border-radius:50%;border:4px solid #38bdf8;box-shadow:0 0 44px rgba(56,189,248,.7),inset 0 0 44px rgba(56,189,248,.45)"></div>
  <div aria-hidden="true" style="position:absolute;right:-400px;top:2700px;width:560px;height:560px;border-radius:50%;border:4px solid #ec4899;box-shadow:0 0 44px rgba(236,72,153,.75),inset 0 0 44px rgba(236,72,153,.5)"></div>

  <!-- NAV -->
  <div class="wrap" style="padding-top:20px;padding-bottom:6px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:36px">
        <a href="#top" style="font-weight:800;font-size:23px;letter-spacing:-.02em"><span style="color:#fff">WP</span><span style="color:#f472b6">Developer</span></a>
        <nav class="nav-links" aria-label="Deal categories" style="display:flex;gap:22px;font-size:14px;font-weight:600">
          <a href="#deals" onClick="{{goWp}}" style="color:#e7e5f2">WordPress</a>
          <a href="#deals" onClick="{{goShop}}" style="color:#e7e5f2">Shopify</a>
          <a href="#deals" onClick="{{goSaas}}" style="color:#e7e5f2">SaaS</a>
          <a href="#deals" onClick="{{goHost}}" style="color:#e7e5f2">Hosting</a>
          <a href="#faq" style="color:#e7e5f2">FAQ</a>
        </nav>
      </div>
      <a href="#deals" class="nav-btn" style="display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(90deg,#7c3aed,#4f6fe8);box-shadow:0 0 24px rgba(124,58,237,.55)">Grab the deals</a>
    </div>
  </div>

  <!-- HERO -->
  <div class="wrap" style="padding-top:44px;text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:20px 18px">
      <h1 style="margin:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px 18px;font-weight:400">
        <span style="font-family:'Anton',Impact,sans-serif;font-size:clamp(64px,9.2vw,126px);line-height:.84;text-transform:uppercase;color:#fff;text-align:left;text-shadow:0 0 28px rgba(255,255,255,.35)">Black<br>Friday</span>

        <span style="position:relative;display:inline-flex;flex-direction:column;align-items:center;transform:rotate(-2.5deg);border:3px solid #ec4899;border-radius:22px;padding:16px 34px 14px;background:rgba(236,72,153,.06);box-shadow:0 0 34px rgba(236,72,153,.7),inset 0 0 28px rgba(236,72,153,.35)">
          <span class="outline-thin" style="font-family:'Anton',Impact,sans-serif;font-size:clamp(24px,3.4vw,44px);letter-spacing:.04em;line-height:1">BIGGEST</span>
          <span style="font-family:'Anton',Impact,sans-serif;font-size:clamp(52px,7.6vw,104px);line-height:.95;letter-spacing:.005em;background:linear-gradient(180deg,#ec4899 0%,#a78bfa 50%,#38bdf8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(167,139,250,.6))">SAVINGS</span>
          <span class="outline-thin" style="font-family:'Anton',Impact,sans-serif;font-size:clamp(16px,2.2vw,28px);letter-spacing:.22em;line-height:1;margin-top:2px">OF THE YEAR</span>
        </span>

        <span style="position:relative;display:inline-block;text-align:left;padding-bottom:10px">
          <span class="outline" style="display:block;font-family:'Anton',Impact,sans-serif;font-size:clamp(48px,6.6vw,92px);line-height:.88;text-transform:uppercase">Cyber<br>Monday</span>
          <span style="position:absolute;right:-18px;bottom:-14px;font-family:'Yellowtail',cursive;font-size:clamp(38px,5vw,68px);line-height:1;color:#f472b6;transform:rotate(-7deg);text-shadow:0 0 18px rgba(244,114,182,.9)">Sale</span>
        </span>
      </h1>
    </div>

    <p style="max-width:700px;margin:38px auto 0;font-size:19px;line-height:1.5;color:#ecebf6">Take WordPress into the AI era for less. Grab up to <strong style="color:#fff">75% off</strong> plugins and SaaS, plus <strong style="color:#fff">Shopify apps</strong> and hosting, from the team behind Essential Addons, Templately, xCloud and more.</p>

    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:22px 18px;margin-top:46px;padding-top:16px">
      <a href="#deals" onClick="{{goWp}}" class="cta-card" style="position:relative;flex:1 1 400px;max-width:440px;min-height:140px;padding:26px 28px;border-radius:16px;text-align:left;background:linear-gradient(110deg,#f472b6,#ec4899 45%,#c084fc);box-shadow:0 0 36px rgba(236,72,153,.5);color:#0a0a14">
        <div style="font-family:'Anton',Impact,sans-serif;font-size:31px;line-height:1.02;text-transform:uppercase;max-width:270px">Save up to 75% on WordPress &amp; SaaS</div>
        <div style="margin-top:18px;font-size:12px;font-weight:800;letter-spacing:.08em">SEE WORDPRESS DEALS &nbsp;&rarr;</div>
        <div aria-hidden="true" style="position:absolute;right:-12px;top:-34px;width:100px;height:100px;border-radius:50%;background:#0a0a14;border:3px solid #f9a8d4;box-shadow:0 0 22px rgba(236,72,153,.75);display:flex;align-items:center;justify-content:center;transform:rotate(10deg)">
          <div style="width:82px;height:82px;border-radius:50%;border:2px dashed #ec4899;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95;font-family:'Anton',Impact,sans-serif;text-align:center">
            <span style="font-size:11px;color:#f9a8d4;letter-spacing:.12em">UP TO</span>
            <span style="font-size:30px;color:#fff">75%</span>
            <span style="font-size:13px;color:#f9a8d4;letter-spacing:.1em">OFF</span>
          </div>
        </div>
      </a>
      <a href="#deals" onClick="{{goShop}}" class="cta-card" style="position:relative;flex:1 1 400px;max-width:440px;min-height:140px;padding:26px 28px;border-radius:16px;text-align:left;background:#0c1220;border:2px solid #38bdf8;box-shadow:0 0 30px rgba(56,189,248,.4),inset 0 0 26px rgba(56,189,248,.12);color:#fff">
        <div style="font-family:'Anton',Impact,sans-serif;font-size:31px;line-height:1.02;text-transform:uppercase;max-width:270px">Grab huge savings on Shopify apps</div>
        <div style="margin-top:18px;font-size:12px;font-weight:800;letter-spacing:.08em;color:#38bdf8">SEE THE SHOPIFY DEALS &nbsp;&rarr;</div>
        <div aria-hidden="true" style="position:absolute;right:-12px;top:-34px;width:100px;height:100px;border-radius:50%;background:#0a1a2c;border:3px solid #7dd3fc;box-shadow:0 0 22px rgba(56,189,248,.75);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)">
          <div style="width:82px;height:82px;border-radius:50%;border:2px dashed #38bdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95;font-family:'Anton',Impact,sans-serif;text-align:center">
            <span style="font-size:11px;color:#7dd3fc;letter-spacing:.12em">UP TO</span>
            <span style="font-size:30px;color:#fff">80%</span>
            <span style="font-size:13px;color:#7dd3fc;letter-spacing:.1em">OFF</span>
          </div>
        </div>
      </a>
    </div>
  </div>

  <!-- TICKER -->
  <div aria-hidden="true" style="position:relative;margin-top:70px;transform:rotate(-1.8deg);width:104%;margin-left:-2%;border-top:1px solid rgba(236,72,153,.65);border-bottom:1px solid rgba(56,189,248,.65);background:linear-gradient(90deg,rgba(236,72,153,.2),rgba(30,41,90,.55) 55%,rgba(56,189,248,.16));box-shadow:0 0 44px rgba(124,58,237,.35);overflow:hidden;padding:18px 0">
    <div class="tick-track">
      <sc-for list="{{ticker}}" as="t" hint-placeholder-count="8">
        <div style="display:flex;align-items:center;gap:30px;padding-right:30px;white-space:nowrap">
          <span class="{{t.cls}}" style="font-family:'Anton',Impact,sans-serif;font-size:34px;letter-spacing:.01em;text-transform:uppercase">{{t.text}}</span>
          <span style="color:#f472b6;font-size:24px;text-shadow:0 0 12px rgba(244,114,182,.9)">&#10022;</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- AGENCY MAX -->
  <div id="agency" class="wrap" style="padding-top:96px;text-align:center">
    <div style="position:relative;display:inline-block;transform:rotate(-5deg);margin-bottom:18px">
      <div style="border:2px solid #facc15;border-radius:12px;background:#17142a;padding:10px 22px 8px;box-shadow:0 0 20px rgba(250,204,21,.45),inset 0 0 14px rgba(250,204,21,.18)">
        <div style="font-family:'Yellowtail',cursive;font-size:34px;line-height:1;color:#f472b6;text-shadow:0 0 12px rgba(244,114,182,.8)">Black Friday</div>
        <div style="font-size:11px;font-weight:800;letter-spacing:.3em;color:#facc15;margin-top:3px">EXCLUSIVE</div>
      </div>
      <div aria-hidden="true" style="position:absolute;left:50%;bottom:-20px;height:20px;border-left:3px dotted #cbd5e1"></div>
    </div>
    <h2 style="margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(40px,5.6vw,76px);line-height:1.02;text-transform:uppercase;text-shadow:0 0 22px rgba(255,255,255,.2)">One bundle, <span class="grad">up to 40% off</span></h2>
    <div aria-hidden="true" style="width:64px;height:3px;border-radius:3px;margin:22px auto 20px;background:linear-gradient(90deg,#ec4899,#38bdf8)"></div>
    <p style="max-width:640px;margin:0 auto;font-size:16px;line-height:1.55;color:#b4b2c8">The WPDeveloper Agency Bundle is now <strong style="color:#fff">Agency Max</strong>. Pick monthly, yearly or lifetime and save on every plan this Black Friday and Cyber Monday.</p>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;max-width:900px;margin:44px auto 0;text-align:left">
      <sc-for list="{{agency}}" as="a" hint-placeholder-count="3">
        <div style="{{a.cardStyle}}">
          <div style="font-size:12px;font-weight:600;color:#9a98b0">{{a.label}}</div>
          <div>
            <div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:#38bdf8">UP TO</div>
            <div style="font-family:'Anton',Impact,sans-serif;font-size:46px;line-height:1.05;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.15)">40% OFF</div>
          </div>
          <a href="https://wpdeveloper.com/" class="card-btn" aria-label="{{a.aria}}" style="{{a.btnStyle}}">Grab the deal</a>
          <div style="height:1px;background:#2a2838"></div>
          <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:#e4e2f1">
            <div style="display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M20 6 9 17l-5-5"/></svg><span>{{a.b1}}</span></div>
            <div style="display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M20 6 9 17l-5-5"/></svg><span>{{a.b2}}</span></div>
            <sc-if value="{{a.hasB3}}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M20 6 9 17l-5-5"/></svg><span>{{a.b3}}</span></div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:20px;font-size:12px;color:#8f8da6">Regular prices shown. Sale prices appear at checkout.</div>
  </div>

  <!-- TABBED DEALS -->
  <div id="deals" class="wrap" style="padding-top:120px;text-align:center">
    <div style="position:relative;display:inline-block">
      <h2 style="margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(38px,5.2vw,70px);line-height:1.04;text-transform:uppercase;text-shadow:0 0 22px rgba(255,255,255,.2)">Pick your stack,<br><span class="grad">grab your deal</span></h2>
      <div aria-hidden="true" style="position:absolute;right:-150px;bottom:-14px;transform:rotate(-7deg)">
        <div style="border:2px solid #facc15;border-radius:12px;background:#17142a;padding:9px 18px 7px;box-shadow:0 0 20px rgba(250,204,21,.45),inset 0 0 14px rgba(250,204,21,.18)">
          <div style="font-family:'Yellowtail',cursive;font-size:30px;line-height:1;color:#f472b6;text-shadow:0 0 12px rgba(244,114,182,.8)">Black Friday</div>
          <div style="font-size:10px;font-weight:800;letter-spacing:.3em;color:#facc15;margin-top:3px;text-align:center">EXCLUSIVE</div>
        </div>
      </div>
    </div>
    <div aria-hidden="true" style="width:64px;height:3px;border-radius:3px;margin:24px auto 20px;background:linear-gradient(90deg,#ec4899,#38bdf8)"></div>
    <p style="max-width:660px;margin:0 auto;font-size:16px;line-height:1.55;color:#b4b2c8">WordPress plugins, Shopify apps, SaaS and hosting. Choose a category and grab the deal on the tools you need.</p>

    <div role="group" aria-label="Deal categories" style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{tb.pressed}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px;text-align:left">
      <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
        <div style="{{p.cardStyle}}">
          <div style="font-size:12px;font-weight:600;color:#9a98b0">{{p.label}}</div>
          <div>
            <div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:#38bdf8;min-height:14px">{{p.pre}}</div>
            <div style="font-family:'Anton',Impact,sans-serif;font-size:38px;line-height:1.05;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.15)">{{p.big}}</div>
          </div>
          <a href="{{p.url}}" class="card-btn" aria-label="{{p.aria}}" style="{{p.btnStyle}}">Grab the deal</a>
          <div style="height:1px;background:#2a2838"></div>
          <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:#e4e2f1">
            <div style="display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M20 6 9 17l-5-5"/></svg><span>{{p.d1}}</span></div>
            <div style="display:flex;gap:10px;align-items:flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M20 6 9 17l-5-5"/></svg><span>{{p.d2}}</span></div>
          </div>
        </div>
      </sc-for>
    </div>
    <p style="max-width:720px;margin:26px auto 0;font-size:13px;line-height:1.5;color:#9a98b0">{{note}}</p>
  </div>

  <!-- BIG DROPS BAND -->
  <div style="margin-top:120px;padding:72px 0 76px;background:linear-gradient(100deg,#f472b6 0%,#ec4899 48%,#a855f7 100%);box-shadow:0 -40px 80px rgba(236,72,153,.18),0 40px 80px rgba(168,85,247,.18)">
    <div class="wrap">
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px">
        <h2 style="margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(40px,5.6vw,76px);line-height:.98;text-transform:uppercase;color:#0a0a14;max-width:640px">The biggest drops of the season</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <div style="background:#0a0a14;border-radius:12px;padding:12px 18px;box-shadow:0 10px 24px rgba(10,10,20,.35)">
            <div style="font-family:'Anton',Impact,sans-serif;font-size:30px;line-height:1;color:#f472b6">NOV 27</div>
            <div style="font-size:12px;color:#c9c7dc;margin-top:4px">Black Friday</div>
          </div>
          <div style="background:#0a0a14;border-radius:12px;padding:12px 18px;box-shadow:0 10px 24px rgba(10,10,20,.35)">
            <div style="font-family:'Anton',Impact,sans-serif;font-size:30px;line-height:1;color:#38bdf8">NOV 30</div>
            <div style="font-size:12px;color:#c9c7dc;margin-top:4px">Cyber Monday</div>
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:36px">
        <sc-for list="{{drops}}" as="d" hint-placeholder-count="3">
          <div style="background:#0a0a14;border-radius:22px;padding:26px 26px 28px;box-shadow:0 18px 40px rgba(10,10,20,.4)">
            <div style="font-family:'Anton',Impact,sans-serif;font-size:76px;line-height:1;background:linear-gradient(180deg,#e879f9,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent">{{d.num}}</div>
            <div style="font-size:17px;font-weight:800;color:#fff;margin-top:4px">{{d.title}}</div>
            <div style="font-size:14px;line-height:1.5;color:#b4b2c8;margin-top:8px">{{d.body}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- FAQ -->
  <div id="faq" class="wrap" style="padding-top:110px;text-align:center">
    <h2 style="margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:clamp(38px,5vw,66px);line-height:1.04;text-transform:uppercase;text-shadow:0 0 22px rgba(255,255,255,.2)">Got questions?<br><span class="grad">Before you grab it</span></h2>
    <div aria-hidden="true" style="width:64px;height:3px;border-radius:3px;margin:24px auto 36px;background:linear-gradient(90deg,#ec4899,#38bdf8)"></div>
    <div style="max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:12px;text-align:left">
      <sc-for list="{{faqs}}" as="f" hint-placeholder-count="5">
        <div style="{{f.rowStyle}}">
          <button type="button" aria-expanded="{{f.open}}" onClick="{{f.toggle}}" style="width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:transparent;border:0;color:#fff;font-size:15px;font-weight:700;text-align:left;cursor:pointer">
            <span>{{f.q}}</span>
            <span aria-hidden="true" style="color:#f472b6;font-size:20px;line-height:1;flex:none">{{f.sign}}</span>
          </button>
          <sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 20px 18px;font-size:14px;line-height:1.6;color:#b4b2c8">{{f.a}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

const tpl=document.getElementById('tpl'),app=document.getElementById('app'),logic=new Component({});
const FULL=/^\s*\{\{\s*([^{}]+?)\s*\}\}\s*$/;
function lookup(s,p){return p.split('.').reduce((o,k)=>o==null?undefined:o[k],s);}
function val(p,s){p=p.trim();if(p==='true')return true;if(p==='false')return false;return lookup(s,p);}
function interp(str,s){return str.replace(/\{\{\s*([^{}]+?)\s*\}\}/g,(m,p)=>{const v=val(p,s);return v==null?'':v;});}
function rn(node,s,out){
 if(node.nodeType===3){out.appendChild(document.createTextNode(interp(node.nodeValue,s)));return;}
 if(node.nodeType!==1)return;
 const tag=node.localName;
 if(tag==='sc-for'){const list=val(FULL.exec(node.getAttribute('list'))[1],s)||[];const as=node.getAttribute('as');
  list.forEach((it,i)=>{const ns=Object.assign({},s,{[as]:it,$index:i});node.childNodes.forEach(c=>rn(c,ns,out));});return;}
 if(tag==='sc-if'){if(val(FULL.exec(node.getAttribute('value'))[1],s))node.childNodes.forEach(c=>rn(c,s,out));return;}
 const el=document.createElementNS(node.namespaceURI,tag);
 for(const a of Array.from(node.attributes)){
  const n=a.name,v=a.value;
  if(n.indexOf('hint-')===0)continue;
  const m=FULL.exec(v);
  if(/^on/.test(n)&&m){const f=val(m[1],s);if(typeof f==='function')el.addEventListener(n.slice(2),f);continue;}
  if(m){const r=val(m[1],s);el.setAttribute(n,r==null?'':String(r));}
  else el.setAttribute(n,interp(v,s));
 }
 node.childNodes.forEach(c=>rn(c,s,el));
 out.appendChild(el);
}
function render(){
 const btns=Array.from(app.querySelectorAll('button')),ai=btns.indexOf(document.activeElement);
 const frag=document.createDocumentFragment(),s=logic.renderVals();
 tpl.content.childNodes.forEach(c=>rn(c,s,frag));
 app.replaceChildren(frag);
 if(ai>=0){const nb=app.querySelectorAll('button')[ai];if(nb)nb.focus({preventScroll:true});}
}
let pending=false;
function schedule(){if(pending)return;pending=true;setTimeout(()=>{pending=false;render();},0);}
